# Publishes com.ectex.updatesite (the p2 update site and its website) with GitHub Pages.
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish update site

on:
  push:
    branches: [main]
    paths:
      - "com.ectex.updatesite/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Publish only what visitors and Eclipse need (not the build script or the project file).
      - name: Collect site files
        run: |
          mkdir _site
          rsync -a --exclude 'build/' --exclude 'dist/' --exclude '.project' com.ectex.updatesite/ _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
